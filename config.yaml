  - id: "keynotes"
    title: "Keynote Speakers"
    content: |
      <h3>Rogelio Cardona-Rivera (University of Utah)</h3>
      <p><strong>Talk Title:</strong> Planning for the Design of Experiences</p>
      <p><strong>Abstract:</strong> Automated planning has long been viewed as a problem-solving paradigm for generating sequences of actions that achieve specified goals. In the context of games, however, its role can be far richer: beyond decision-making, it can serve as a representational, organizational, and interactional framework. In this talk, I will offer a reflective view on my prior work for planning the design of playful experiences and chart potential futures centered on the idea of planning as foundational to shaping how games are designed, experienced, and understood.</p>
      <div style="display: block; overflow: hidden; margin-top: 15px; margin-bottom: 30px;">
        <img src="https://i.ibb.co/mr2sGmn6/Rogelio-headshot-left-500pxsq.jpg" alt="Dr. Rogelio E. Cardona-Rivera" style="float: left; width: 160px; margin-right: 20px; border-radius: 4px; margin-bottom: 10px;" />
        <div style="overflow: hidden;">
          <p style="margin: 0;"><strong>Bio:</strong> Dr. Rogelio E. Cardona-Rivera is a Puerto Rican computational game design scientist. Rogelio co-founded the Division of Games at the University of Utah, where they serve as an Assistant Professor (with courtesy appointments in Computer Science and Psychology). Prior to joining the faculty at Utah, Dr. Cardona-Rivera was a research scientist at Sandia National Laboratories and Disney Research.
          At Utah, Rogelio directs the Laboratory for Quantitative Experience Design, a community of scholars who build plan-based models of storygames and investigate their relation to player psychology and experience. Prof. Cardona-Rivera obtained the BS degree in Computer Engineering from the University of Puerto Rico at Mayaguez and the PhD degree in Computer Science from North Carolina State University in the United States. Rogelio has authored over 30 articles and books and has obtained nearly 1.5 million (USD) in support for their research projects toward establishing a science of game design, including CAREER and collaborative grants from the U.S. National Science Foundation, sponsorships from the games industry via Oculus VR and Activision Blizzard, and grants from the Department of Energy, IARPA, and the US Naval Research Laboratory.</p>
        </div>
      </div>
      <hr>
      <h3>Jeff Orkin (Bitpart AI)</h3>
      <p><strong>Talk Title:</strong> Planning in Games in the Age of LLMs</p>
      <p><strong>Abstract:</strong> Bitpart is building a multi-agent, multi-modal hierarchical planning system for games, to puppeteer groups of NPCs in living worlds, and narrative experiences. This talk will explore our approach, discuss technical design decisions we've made, and challenges we've faced implementing a powerful planner. In the process, we will consider how LLMs and planners can work together, to balance the pros and cons of each, and achieve the best of both worlds.</p>
      <div style="display: block; overflow: hidden; margin-top: 15px;">
        <img src="https://i.ibb.co/jvXnzTLM/1781892603792.jpg" alt="Dr. Jeff Orkin" style="float: left; width: 160px; margin-right: 20px; border-radius: 4px; margin-bottom: 10px;" />
        <div style="overflow: hidden;">
          <p style="margin: 0;"><strong>Bio:</strong> Dr. Jeff Orkin is an AI researcher, entrepreneur, and game industry veteran. He is the Co-founder and CEO of Bitpart AI, a startup focused on building advanced NPC systems that combine Large Language Models (LLMs) with automated planning to enable more dynamic and believable game worlds. Prior to Bitpart AI, he founded Giant Otter Technologies, a conversational AI company that emerged from his PhD research at the MIT Media Lab, where he worked on learning character behavior from human gameplay data.
          Jeff spent over a decade in the game industry as an AI specialist at Sierra and Monolith Productions, contributing to landmark titles such as No One Lives Forever 2 and F.E.A.R., the latter of which is widely recognized for pioneering the use of Goal-Oriented Action Planning (GOAP) in commercial games. His work has been influential in shaping modern game AI systems that balance planning, behavior trees, and emergent agent behavior.
          He has co-authored volumes in the AI Game Programming Wisdom series, served as Associate Editor for the IEEE Transactions on Computational Intelligence and AI in Games, and has presented at major conferences including GDC, AIIDE, IEEE CIG, AAAI, AAMAS, ICAPS, and SARA. He holds a Master's degree in Computer Science from the University of Washington and a Bachelor's degree in Computer Science from Tufts University, with a minor in Studio Art.</p>
        </div>
      </div>

