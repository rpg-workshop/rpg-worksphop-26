    content: |
      <p>Submit papers via <strong><a href="https://easychair.org/my/conference?conf=rpg26">EasyChair</a></strong> using the <strong><a href="https://aaai.org/authorkit26-1/">ICAPS 2026 paper template</a></strong>.</p>
      <p>Please send questions to <a href="mailto:rpg26@easychair.org">rpg26@easychair.org</a></p>
      <ul>
        <li>Regular papers: up to <strong>8 pages</strong> + unlimited references</li>
        <li>Short / position papers: up to <strong>4 pages</strong> + unlimited references</li>
        <li>All submissions must be in <strong>PDF format</strong></li>
      </ul>
      <p>At least one author of each accepted paper must register for the ICAPS 2026 workshop day.
      Accepted papers will be made available on the workshop website.</p>

